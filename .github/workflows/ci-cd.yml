name: Pipeline CI/CD - Cidades ESG Inteligentes

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================
  # 1. ETAPA DE BUILD E TESTES AUTOMATIZADOS (CI)
  # ==============================================================
  build-and-test:
    name: 🔨 Build & Testes Automatizados (JUnit)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: ⚙️ Garantir Permissão no Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compilar Projeto (Build)
        run: mvn clean compile -B

      - name: Executar Testes Automatizados
        run: mvn test -B

      - name: 📊 Publicar Relatório de Testes (Surefire Reports)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

  # ==============================================================
  # 2. ETAPA DE CONTAINERIZAÇÃO (BUILD & PUSH DOCKER)
  # ==============================================================
  docker-build-push:
    name: 🐳 Build & Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Metadados e Tags Semânticas Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: 📦 Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================
  # 3. ETAPA DE DEPLOY AUTOMATIZADO - AMBIENTE DE STAGING
  # ==============================================================
  deploy-staging:
    name: 🚀 Deploy Automatizado - STAGING
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment:
      name: staging
      url: http://staging.cidades-esg.com.br
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🌐 Executar Provisionamento em STAGING (Porta 8081)
        run: |
          echo "=========================================================="
          echo "🚀 Provisionando Ambiente de STAGING (Homologação)"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================================="
          docker compose -f docker-compose.staging.yml down || true
          docker compose -f docker-compose.staging.yml up -d --build

      - name: 🩺 Smoke Test & Healthcheck Real em Staging
        run: |
          echo "🔍 Aguardando backend subir na porta 8081..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Healthcheck Staging OK! Status HTTP 200 recebido."
              curl -s http://localhost:8081/actuator/health
              exit 0
            fi
            echo "Tentativa $i/30: Backend ainda inicializando (Status: $STATUS)..."
            sleep 3
          done
          echo "❌ Falha no Healthcheck do ambiente de Staging!"
          docker compose -f docker-compose.staging.yml logs
          exit 1

  # ==============================================================
  # 4. ETAPA DE DEPLOY AUTOMATIZADO - AMBIENTE DE PRODUÇÃO
  # ==============================================================
  deploy-production:
    name: 🏆 Deploy Automatizado - PRODUÇÃO
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: http://api.cidades-esg.com.br
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🚀 Executar Deploy em PRODUÇÃO (Porta 8080)
        run: |
          echo "=========================================================="
          echo "🏆 Provisionando Ambiente de PRODUÇÃO"
          echo "Release Version: v1.0.0"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================================="
          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml up -d --build

      - name: 🩺 Smoke Test & Healthcheck Real em Produção
        run: |
          echo "🔍 Aguardando backend de Produção responder na porta 8080..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Healthcheck Produção OK! Status HTTP 200 recebido."
              curl -s http://localhost:8080/actuator/health
              exit 0
            fi
            echo "Tentativa $i/30: Backend Produção ainda inicializando (Status: $STATUS)..."
            sleep 3
          done
          echo "❌ Falha no Healthcheck do ambiente de Produção!"
          docker compose -f docker-compose.prod.yml logs
          exit 1
