version: "3.9"

# ============================================================
# Docker Compose — Ambiente de PRODUÇÃO
# ============================================================

services:
  mongodb-prod:
    image: mongo:7.0
    container_name: esg-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: cidades_esg_prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - esg-prod-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esg-backend-prod
    restart: always
    depends_on:
      mongodb-prod:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb-prod:27017/cidades_esg_prod
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 8080
      ENVIRONMENT: production
    networks:
      - esg-prod-net

networks:
  esg-prod-net:
    driver: bridge

volumes:
  mongo_prod_data:
