apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cidades-esg-ingress-prod
  namespace: cidades-esg-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: api.cidades-esg.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service-prod
                port:
                  number: 80
