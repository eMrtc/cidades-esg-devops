apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment-prod
  namespace: cidades-esg-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-prod
  template:
    metadata:
      labels:
        app: backend-prod
    spec:
      containers:
        - name: backend
          image: ghcr.io/seu-usuario/cidades-esg-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config-prod
            - secretRef:
                name: backend-secret-prod
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service-prod
  namespace: cidades-esg-prod
spec:
  type: LoadBalancer
  selector:
    app: backend-prod
  ports:
    - port: 80
      targetPort: 8080
