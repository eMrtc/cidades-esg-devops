apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config-prod
  namespace: cidades-esg-prod
data:
  PORT: "8080"
  MONGO_URI: "mongodb://mongodb-service-prod:27017/cidades_esg_prod"
  SPRING_PROFILES_ACTIVE: "prod"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret-prod
  namespace: cidades-esg-prod
type: Opaque
stringData:
  JWT_SECRET: "SUBSTITUIR_POR_SECRET_SEGURO"
  JWT_EXPIRATION_MS: "86400000"
  GEMINI_API_KEY: ""
