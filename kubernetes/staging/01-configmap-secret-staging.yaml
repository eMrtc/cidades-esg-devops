apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config-staging
  namespace: cidades-esg-staging
data:
  PORT: "8080"
  MONGO_URI: "mongodb://mongodb-service-staging:27017/cidades_esg_staging"
  SPRING_PROFILES_ACTIVE: "staging"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret-staging
  namespace: cidades-esg-staging
type: Opaque
stringData:
  JWT_SECRET: "SUBSTITUIR_POR_SECRET_SEGURO"
  JWT_EXPIRATION_MS: "3600000"
  GEMINI_API_KEY: ""
