apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment-staging
  namespace: cidades-esg-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-staging
  template:
    metadata:
      labels:
        app: backend-staging
    spec:
      containers:
        - name: backend
          image: ghcr.io/seu-usuario/cidades-esg-backend:develop
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config-staging
            - secretRef:
                name: backend-secret-staging
          resources:
            requests:
              memory: "192Mi"
              cpu: "150m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service-staging
  namespace: cidades-esg-staging
spec:
  type: ClusterIP
  selector:
    app: backend-staging
  ports:
    - port: 8081
      targetPort: 8080
