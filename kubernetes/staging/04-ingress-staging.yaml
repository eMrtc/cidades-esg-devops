apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cidades-esg-ingress-staging
  namespace: cidades-esg-staging
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: staging.cidades-esg.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service-staging
                port:
                  number: 8081
